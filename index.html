
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hajatan Warga</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#21182e;color:white;font-family:system-ui;text-align:center}
header{padding:14px;background:#49263f;font-weight:bold;font-size:20px}
#scene{width:100%;height:68vh;display:block}
.panel{padding:12px;background:#30213b}
button{border:0;border-radius:14px;padding:14px;margin:5px;background:#ffd16b;color:#402338;font-weight:bold;font-size:15px}
#names{font-size:13px;color:#ffe5a5}
</style>
</head>
<body>
<header>🎊 HAJATAN WARGA 🎊</header>
<div id="scene"></div>
<div class="panel">
  <div id="count">👥 Tamu: 5</div>
  <div id="names">Selamat datang di hajatan!</div>
  <button onclick="addGuest()">🌹 TAMBAH TAMU</button>
  <button onclick="dance()">🕺 JOGED BARENG</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#8c668c');
scene.fog=new THREE.Fog('#8c668c',18,35);

const camera=new THREE.PerspectiveCamera(45,root.clientWidth/root.clientHeight,.1,100);
camera.position.set(0,10,17);
camera.lookAt(0,1,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(root.clientWidth,root.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x66506c,2));
const light=new THREE.DirectionalLight(0xffe0b0,3);
light.position.set(-5,10,8);
scene.add(light);

function material(color){return new THREE.MeshStandardMaterial({color})}
function cube(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);scene.add(m);return m;
}
function ball(r,color,x,y,z,sx=1,sy=1,sz=1){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material(color));
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);scene.add(m);return m;
}

// Lantai hajatan
cube(28,.3,24,'#54844f',0,-.3,0);
cube(13,.15,8,'#e8d8c2',0,-.05,3);

// Panggung
cube(9,.5,2.5,'#8e344d',0,.35,-6);
cube(7,.2,1.8,'#f3d7a5',0,.7,-6);
cube(5,2,.25,'#bd536c',0,1.8,-7);
cube(5.5,.18,.3,'#f9d27c',0,2.9,-6.8);

// Pelaminan
for(const x of [-2.5,2.5]){
 cube(.25,2.8,.3,'#e9b85e',x,1.8,-6.7);
 ball(.3,'#ffe1a0',x,3.3,-6.7);
}

// Tenda
for(const x of [-7,7])for(const z of [-5,5])
 cube(.18,4,.18,'#c94d5c',x,2,z);
const roof=new THREE.Mesh(new THREE.ConeGeometry(8,2,4),material('#f5d9c2'));
roof.position.set(0,4,0);roof.rotation.y=Math.PI/4;
roof.scale.set(1,.7,.8);scene.add(roof);

// Lampu hias
for(let i=0;i<9;i++){
 ball(.13,'#ffdf85',-8+i*2,4.3,-1);
 const l=new THREE.PointLight('#ffcb78',1,5);
 l.position.set(-8+i*2,4.3,-1);scene.add(l);
}

// Prasmanan
cube(2,.3,1,'#704452',-7,.7,2);
cube(2,.15,1,'#ffe0a8',-7,.9,2);
for(let i=0;i<3;i++)ball(.3,['#e7a54e','#73a45d','#c65c54'][i],-7.6+i*.6,1.2,2,.9,.5,.9);

const guests=[];
const outfits=['#e9a0a8','#6f9b91','#a78ac5','#e6b85e','#83a5d1','#d47d55'];
function guest(name,x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
 const body=new THREE.Group();g.add(body);
 const cloth=material(outfits[guests.length%outfits.length]);
 const skin=material('#ffd0a8'),hair=material('#382633'),dark=material('#302536');
 function part(geo,mat,x,y,z,sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);body.add(m);return m;
 }
 part(new THREE.SphereGeometry(.4,16,12),cloth,0,.85,0,.85,1.15,.65);
 part(new THREE.SphereGeometry(.4,16,12),skin,0,1.65,0,1,1,.9);
 part(new THREE.SphereGeometry(.41,16,12),hair,0,1.87,0,1.05,.6,1);
 for(const x of [-.14,.14])part(new THREE.SphereGeometry(.045,8,8),dark,x,1.67,-.36);
 for(const x of [-.42,.42])part(new THREE.SphereGeometry(.13,10,8),skin,x,1,.0,.8,2.2,.8);
 for(const x of [-.17,.17])part(new THREE.BoxGeometry(.18,.45,.2),dark,x,.25,0);
 // Username
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=100;
 const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText(name,256,65);
 const tex=new THREE.CanvasTexture(canvas);
 const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
 tag.position.y=2.5;tag.scale.set(2,.4,1);g.add(tag);
 guests.push({g,body,phase:Math.random()*6});
}
for(let i=0;i<5;i++)guest('Tamu '+(i+1),(i-2)*1.5,1+(i%2));
let total=5,active=false;
window.addGuest=()=>{
 total++;guest('Tamu '+total,(Math.random()-.5)*8,1+Math.random()*3);
 document.getElementById('count').textContent='👥 Tamu: '+total;
 document.getElementById('names').textContent='🎁 Tamu baru datang!';
};
window.dance=()=>{
 active=!active;
 document.getElementById('names').textContent=active?'🎶 Musik dimulai! Joget bareng!':'Musik berhenti';
};
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 guests.forEach(p=>{
  p.body.position.y=Math.abs(Math.sin(t*4+p.phase))*(active?.22:.04);
  p.body.rotation.z=active?Math.sin(t*5+p.phase)*.2:0;
 });
 renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
 camera.aspect=root.clientWidth/root.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(root.clientWidth,root.clientHeight);
});
</script>
</body>
</html>
